# nginx-Konfiguration für das Kursbuch-Dashboard (Vorlage – manuell prüfen und einsetzen).
#
# Ziel: /etc/nginx/sites-available/kursbuch  (Symlink nach sites-enabled)
# Ersetze vorher ALLE Vorkommen von  dashboard.EIGENE-DOMAIN.de  durch deine Subdomain.
# Die Datei betrifft nur diesen Hostnamen; die WordPress-Server-Blöcke bleiben unberührt.
# Ablauf (Zertifikat zuerst, dann HTTPS-Block) siehe docs/DEPLOYMENT.md.

# Drosselung für den Login (gilt nur für die location /api/login unten).
# Muss im http-Kontext stehen – Dateien in sites-enabled werden dort eingebunden.
limit_req_zone $binary_remote_addr zone=kursbuch_login:10m rate=10r/m;

upstream kursbuch_app {
    server 127.0.0.1:8710;
    keepalive 8;
}

# --- Port 80: nur ACME-Challenge (Zertifikat) und Umleitung auf HTTPS -------------
server {
    listen 80;
    listen [::]:80;
    server_name dashboard.EIGENE-DOMAIN.de;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Port 443: Dashboard -----------------------------------------------------------
server {
    # Schreibweise für nginx 1.18/1.24 (Ubuntu 22.04/24.04). Ab nginx 1.25.1 stattdessen
    # "listen 443 ssl;" plus "http2 on;" verwenden (die alte Form erzeugt dort nur eine Warnung).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dashboard.EIGENE-DOMAIN.de;

    ssl_certificate     /etc/letsencrypt/live/dashboard.EIGENE-DOMAIN.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashboard.EIGENE-DOMAIN.de/privkey.pem;
    # Falls vorhanden, deine bestehenden TLS-Einstellungen wiederverwenden, z. B.:
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    client_max_body_size 64k;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Proxy-Header bewusst explizit statt "include proxy_params": X-Forwarded-For enthält
    # nur die echte Client-IP, damit niemand über einen eigenen Header die Login-Sperre
    # umgehen oder fail2ban fremde IPs sperren lassen kann. Gilt für alle locations,
    # solange diese selbst kein proxy_set_header setzen.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    access_log /var/log/nginx/kursbuch_access.log;
    error_log  /var/log/nginx/kursbuch_error.log;

    location = /api/login {
        limit_req zone=kursbuch_login burst=5 nodelay;
        proxy_pass http://kursbuch_app;
    }

    location /assets/ {
        proxy_pass http://kursbuch_app;
        expires 1h;
    }

    location / {
        proxy_pass http://kursbuch_app;
        proxy_read_timeout 60s;
    }
}
