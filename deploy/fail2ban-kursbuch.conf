# Optional: fail2ban-Regel für fehlgeschlagene Dashboard-Logins (Vorlage).
# Die App schreibt bei jedem Fehlversuch ins Journal:
#   "... WARNING kursbuch: Fehlgeschlagener Login von <IP>"
# (echte Client-IP, da nginx X-Forwarded-For setzt und uvicorn ihn von 127.0.0.1 akzeptiert)
#
# Aufteilen in zwei Dateien:
#
# ---- /etc/fail2ban/filter.d/kursbuch.conf -----------------------------------------
# [Definition]
# failregex = Fehlgeschlagener Login von <HOST>$
# ignoreregex =
# journalmatch = _SYSTEMD_UNIT=kursbuch.service
#
# ---- /etc/fail2ban/jail.d/kursbuch.local -------------------------------------------
# [kursbuch]
# enabled  = true
# backend  = systemd
# filter   = kursbuch
# maxretry = 5
# findtime = 15m
# bantime  = 1h
# port     = http,https
#
# Testen:  fail2ban-regex systemd-journal /etc/fail2ban/filter.d/kursbuch.conf
