name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhängigkeiten
        run: pip install -r backend/requirements-dev.txt ruff
      - name: Lint
        run: ruff check backend --select E,F,W,B --line-length 120
      - name: Tests
        working-directory: backend
        run: pytest -q
      - name: Frontend-Syntax
        run: for f in frontend/assets/*.js; do node --check "$f"; done
